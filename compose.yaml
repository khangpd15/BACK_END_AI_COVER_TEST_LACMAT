name: remicare-cover
services:
  cover-test:
    build: .
    container_name: remicare-cover-backend
    platform: linux/amd64
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      PORT: "8000"
      KEEP_ALIVE_ENABLED: "false"
      REMICARE_FRONTEND_ORIGINS: "https://remicare.id.vn,https://www.remicare.id.vn,https://cover-test.remicare.id.vn,http://localhost:5173,http://localhost:3000"
    ports:
      - "127.0.0.1:8002:8000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
