name: remicare-cover
services:
  cover-test:
    image: ghcr.io/khangpd15/back_end_ai_cover_test_lacmat:latest
    container_name: remicare-cover-backend
    platform: linux/amd64
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      PORT: "8000"
      KEEP_ALIVE_ENABLED: "false"
      COVER_MULTIMODAL_MODEL_PATH: /srv/remicare/models/cover_multimodal_model.joblib
      REMICARE_FRONTEND_ORIGINS: "https://remicare.id.vn,https://www.remicare.id.vn,https://cover-test.remicare.id.vn,http://localhost:5173,http://localhost:3000"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:8002:8000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - python
        - docker/healthcheck.py
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
